# Daily Georgia — runs the full pipeline once a day.
#
# Required configuration (set manually in the repo before the first cron fires):
#   Secrets (repo settings → Secrets and variables → Actions → Secrets):
#     - ANTHROPIC_API_KEY        — Anthropic API key (must have Claude Opus 5 access)
#     - GOATCOUNTER_API_KEY      — GoatCounter API token
#   Variables (repo settings → Secrets and variables → Actions → Variables):
#     - GOATCOUNTER_CODE         — GoatCounter site code (non-secret; appears in the tracking script)
#
# The fetcher step is allowed to fail (no analytics yet, API outage, etc.); Georgia still runs.

name: Daily Georgia

on:
  schedule:
    # NOT on the hour. GitHub's scheduler is best-effort and queues hardest at
    # :00, which is where this used to sit. An odd minute is the documented
    # mitigation. It does not make delivery guaranteed; nothing does.
    #
    # What the run history actually shows, corrected 2026-08-29 — the earlier
    # note here said "30-58 minutes late", which understated the tail by about
    # 4x and made this look more fixed than it is:
    #
    #   '0 7'  (25 scheduled fires, 08-02..08-26): delivered +31m to +3h44m,
    #          then dropped outright on 08-27.
    #   '23 7' (since 08-27): two opportunities. 08-28 delivered +12h06m,
    #          08-29 not delivered at all.
    #
    # The delay is upstream of run creation, not runner acquisition: across all
    # 30 runs sampled, created_at == run_started_at to the second. GitHub
    # creates the run late. Nothing in this repo can influence that, so moving
    # the minute is a lottery ticket, not a fix — the fix is to stop depending
    # on one delivery. See run_georgia's already-built guard, which is what
    # makes additional windows safe to add.
    - cron: '23 7 * * *'  # ≈3:23am EDT / 2:23am EST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — exercise the whole pipeline but write nothing back. Leaves the live site alone."
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Fetch yesterday's feedback from GoatCounter
        env:
          GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
        run: python -m scripts.fetch_feedback
        continue-on-error: true

      # Georgia's five daily inputs. Individually defensive — a dead source is
      # recorded as dead and the rest still land — so this should never fail the
      # build, but continue-on-error keeps a total outage from stopping the day.
      # continue-on-error only rescues a step that FINISHES and fails. requests'
      # timeout is a per-read idle timeout, so an upstream dribbling bytes hangs
      # forever and the job sits until GitHub's 360-minute default. Bound it.
      - name: Fetch daily inputs
        timeout-minutes: 10
        run: python -m scripts.fetch_daily_inputs
        continue-on-error: true

      # Corpus health check. Deliberately outside the critical path: it reports,
      # it never blocks. A dead file_id would fail Georgia's request before
      # inference, so it is worth knowing about — but a verification problem must
      # never be the reason the site doesn't ship, and story_016's text-only retry
      # already covers a frame that dies between this check and the call.
      #
      # This exists because "Jeff checks it manually" stopped being true. The
      # fail-open retry means a corpus rotting one frame at a time would surface
      # only as a stats-page warning nobody was reading.
      - name: Verify the corpus still resolves
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m scripts.corpus.publish --verify-only
        continue-on-error: true

      # A manual dispatch defaults to a dry run: real runner, real secrets, real
      # API call, but --no-commit returns before both the commit and the push, so
      # nothing reaches the repo. The scheduled run is never a dry run.
      - name: Run Georgia
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          GEORGIA_PUSH: "true"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          git config user.name "Georgia"
          git config user.email "georgia@clarkle.com"
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::Dry run — nothing will be committed or pushed."
            python -m scripts.run_georgia --no-commit
          else
            python -m scripts.run_georgia
          fi

      # On a dry run the generated site only exists on the runner, so hand it
      # back as an artifact instead of throwing it away.
      - name: Upload dry-run output
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: georgia-dry-run
          path: |
            index.html
            log/
            prompts/
          retention-days: 7
