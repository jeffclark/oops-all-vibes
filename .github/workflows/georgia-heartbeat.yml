# Did Georgia build today?
#
# `schedule` is best-effort. On 2026-08-27 the Daily Georgia event was never
# delivered — no run, no failure, no notification, just a missing day on a site
# whose entire premise is that it regenerates daily. Nothing noticed. The way
# it surfaced was Jeff looking at the site.
#
# This closes that gap and nothing else. It does NOT dispatch a build: deciding
# to publish is Jeff's, and an alert that silently fixes things trains you to
# stop reading it. It opens an issue and stops.
#
# The check is archive/<date>.html, the file write_outputs commits at the end of
# a successful build. Asking "did today's page land" rather than "did the run
# succeed" is deliberate — it catches a dropped event and a green-but-empty run
# with the same question, and it is the question a reader of the site would ask.
#
# This workflow is itself scheduled, so it can be dropped too. It is a smoke
# alarm, not a guarantee.

name: Georgia heartbeat

on:
  schedule:
    # 13:47 UTC ≈ 9:47am EDT. Daily Georgia is nominally 07:23 UTC and takes
    # ~10-15 minutes, so this leaves hours of slack for a late-but-delivered
    # event before it calls the day missing. Off the hour, for the same reason
    # the build itself is.
    - cron: '47 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Look for today's archive entry
        id: check
        run: |
          TODAY="$(date -u +%F)"
          echo "date=$TODAY" >> "$GITHUB_OUTPUT"
          if [ -f "archive/$TODAY.html" ]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
            echo "archive/$TODAY.html is present — Georgia built today."
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "::warning::archive/$TODAY.html is missing — no build landed for $TODAY."
          fi

      - name: Open an issue if she didn't
        if: steps.check.outputs.missing == 'true'
        uses: actions/github-script@v7
        env:
          MISSING_DATE: ${{ steps.check.outputs.date }}
        with:
          script: |
            const date = process.env.MISSING_DATE;
            const title = `Georgia did not build: ${date}`;

            // One issue per missing date. This runs daily and a gap can persist
            // for days; re-opening the same issue every morning would bury the
            // signal under itself.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            if (existing.data.some(i => i.title === title)) {
              core.info(`Already open: "${title}" — nothing to do.`);
              return;
            }

            const runs = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/daily-georgia.yml`;
            const body = [
              `\`archive/${date}.html\` does not exist on \`${context.ref}\`, so no build landed for ${date}.`,
              ``,
              `This checks the committed artifact rather than the run's exit status, so it fires for either cause:`,
              ``,
              `- **The scheduled event was never delivered.** GitHub's \`schedule\` trigger is best-effort. There will be no run at all — not a failed one. Check the [run history](${runs}) for a gap.`,
              `- **The run happened and did not produce a page.** There will be a run to read.`,
              ``,
              `Nothing has been dispatched. To publish the missing day, run **Daily Georgia** manually with \`dry_run: false\`.`,
              ``,
              `---`,
              `_Generated by [Claude Code](https://claude.ai/code)_`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
            core.info(`Opened: "${title}"`);
